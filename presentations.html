const list=document.getElementById('preslist');
let filter='all', showEarly=false;
function render(){
  list.innerHTML=pres.filter(p=>{
    if(!showEarly && p.e) return false;
    if(filter==='intl') return !!p.intl;
    if(filter!=='all' && String(p.y)!==filter) return false;
    return true;
  }).map(p=>{
    const tag = p.intl ? '<span class="intl" data-en="INTL" data-ko="국제">INTL</span>' : '';
    return `<div class="pres"><div class="yr">${p.y}</div><div class="body">${p.h}${tag}</div></div>`;
  }).join('')
  || '<div class="pres"><div class="yr"></div><div class="body" style="color:var(--muted)">—</div></div>';
  if(window.setLang){ try{ window.setLang(localStorage.getItem('starlab-lang')||'en'); }catch(e){} }
}
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.fbtn'); if(!b)return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  filter=b.dataset.y;
  if(filter==='intl' || (filter!=='all' && Number(filter)<=2022)) showEarly=true;
  render();
});
document.getElementById('showall').addEventListener('click',e=>{
  showEarly=!showEarly;
  const b=e.target;
  b.setAttribute('data-en', showEarly?'Hide earlier':'Show earlier (2015–2022)');
  b.setAttribute('data-ko', showEarly?'이전 발표 접기':'이전 발표 보기 (2015–2022)');
  b.textContent = (localStorage.getItem('starlab-lang')==='ko') ? b.getAttribute('data-ko') : b.getAttribute('data-en');
  render();
});
render();
