<header class="page-head">

    <h1 data-en="Lab moments" data-ko="연구실 갤러리">Lab moments</h1>

       data-ko="학회, 세미나, 그리고 연구실의 순간들. 사진을 클릭하면 크게 볼 수 있습니다.">Conferences, seminars, and life around the lab. Click any photo to enlarge.</p>

       data-ko="아직 사진이 없습니다. images/gallery/ 폴더에 사진을 올리고 아래 배열에 추가하세요.">No photos yet.</p>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="x" onclick="closeLb()">×</button>
  <button class="nav-arrow prev" onclick="stepLb(-1)">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="nav-arrow next" onclick="stepLb(1)">›</button>
  <div class="cap" id="lb-cap"></div>
</div>

<script src="assets/site.js"></script>
<script>
/* ============================================================
   GALLERY PHOTOS — edit this array.
     file    : filename in images/gallery/
     captionEn / captionKo : caption text (optional)
   To add a photo: upload it to images/gallery/ then add a line here.
   ============================================================ */
const photos = [
  // 2026 — Korean Statistical Society (KSS) Summer Conference
  {file:'2026_KSS.jpg',       captionEn:'KSS Summer Conference 2026',                     captionKo:'한국통계학회 하계학술논문발표회 2026'},
  {file:'2026_KSS_jung.jpg',  captionEn:'D. Jeong — poster presentation, KSS 2026',       captionKo:'정도웅 — 포스터 발표, KSS 2026'},
  {file:'2026_KSS_min.jpg',   captionEn:'D. Min — poster presentation, KSS 2026',         captionKo:'민대홍 — 포스터 발표, KSS 2026'},

  // 2025 — Forum "Math for Industry" (FMfI 2025), POSCO Center, Seoul
  {file:'2025_FMFI.jpg',      captionEn:'Forum "Math for Industry" 2025',                 captionKo:'Forum "Math for Industry" 2025'},
  {file:'2025_FMFI_1.jpg',    captionEn:'Welcoming remarks, FMfI 2025',                   captionKo:'개회사, FMfI 2025'},
  {file:'2025_FMFI_pyo.jpg',  captionEn:'S.-I. Pyo — talk, FMfI 2025',                    captionKo:'표성인 — 발표, FMfI 2025'},
  {file:'2025_FMFI_jang.jpg', captionEn:'S. Jang — talk, FMfI 2025',                      captionKo:'장설 — 발표, FMfI 2025'},
  {file:'2025_FMFI_lee.jpg',  captionEn:'D. Lee — talk, FMfI 2025',                       captionKo:'이동한 — 발표, FMfI 2025'},

  // 2025 — Korean Statistical Society (KSS) Summer Conference, Gyeongju
  {file:'2025_KSS.jpg',       captionEn:'KSS Summer Conference 2025, Gyeongju',           captionKo:'한국통계학회 하계학술논문발표회 2025, 경주'},

  // 2024 — KSS / KSIAM
  {file:'2024_KSS_ryu.jpg',   captionEn:'J. Ryu — poster presentation, KSS 2024',         captionKo:'류준호 — 포스터 발표, KSS 2024'},
  {file:'2024_KSS_lee.jpg',   captionEn:'D. Lee — poster presentation, KSS 2024',         captionKo:'이동현 — 포스터 발표, KSS 2024'},
  {file:'2024_KSIAM.png',     captionEn:'Poster presentation, KSIAM 2024',               captionKo:'포스터 발표, KSIAM 2024'},

  // 2023 — KSS & group
  {file:'2023_KSS_pyo.jpg',   captionEn:'S.-I. Pyo — poster presentation, KSS 2023',      captionKo:'표성인 — 포스터 발표, KSS 2023'},
  {file:'2023_KSS_lee.jpg',   captionEn:'J. Lee — poster presentation, KSS 2023',         captionKo:'이주홍 — 포스터 발표, KSS 2023'},
  {file:'2023_grad.jpg',      captionEn:'Lab gathering, 2023',                            captionKo:'연구실 모임, 2023'},

  // 2020 — Korean Data Mining Society & lab
  {file:'2020_KDMS.jpg',      captionEn:'Korean Data Mining Society, 2020',               captionKo:'한국데이터마이닝학회, 2020'},

  // Lab trip — Kyushu University
  {file:'2025_JP.jpg',        captionEn:'Lab visit to Kyushu University',                 captionKo:'규슈대학 방문'},
];

const grid = document.getElementById('gallery');
const lang = () => (localStorage.getItem('starlab-lang')||'en');
function cap(p){ return (lang()==='ko' ? p.captionKo : p.captionEn) || ''; }

grid.innerHTML = photos.map((p,i)=>`
  <div class="gcard" onclick="openLb(${i})">
    <img src="images/gallery/${p.file}" alt="${p.captionEn||''}"
         onerror="this.closest('.gcard').style.display='none';checkEmpty()">
    ${(p.captionEn||p.captionKo)?`<div class="cap" data-en="${p.captionEn||''}" data-ko="${p.captionKo||''}">${cap(p)}</div>`:''}
  </div>`).join('');

function checkEmpty(){
  const visible = [...document.querySelectorAll('.gcard')].some(c=>c.style.display!=='none');
  document.getElementById('empty-note').style.display = visible ? 'none' : 'block';
}

/* ---- Lightbox ---- */
let lbIndex = 0;
function openLb(i){
  lbIndex = i;
  showLb();
  document.getElementById('lightbox').classList.add('open');
}
function showLb(){
  const p = photos[lbIndex];
  document.getElementById('lb-img').src = 'images/gallery/'+p.file;
  document.getElementById('lb-cap').textContent = cap(p);
}
function stepLb(d){
  lbIndex = (lbIndex + d + photos.length) % photos.length;
  showLb();
}
function closeLb(){ document.getElementById('lightbox').classList.remove('open'); }
document.getElementById('lightbox').addEventListener('click', e=>{
  if(e.target.id==='lightbox') closeLb();
});
document.addEventListener('keydown', e=>{
  if(!document.getElementById('lightbox').classList.contains('open'))return;
  if(e.key==='Escape')closeLb();
  if(e.key==='ArrowLeft')stepLb(-1);
  if(e.key==='ArrowRight')stepLb(1);
});

if(window.setLang){ try{ window.setLang(lang()); }catch(e){} }
</script>
</body>
</html>
