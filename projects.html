     agencyKo / agencyEn : funding agency

   Order: newest first.
   ============================================================ */
const projects = [

   titleEn:'Development and application of mathematical modeling for large-scale multi-dimensional tensors',

   period:'2025.03 – 2029.02', role:'pi'},

  {titleKo:'BK21 4단계 — 아주 수리과학 미래인재양성 교육연구팀',

   period:'2024.03 – 2027.08', role:'co'},

  {titleKo:'기초과학연구소',

  {titleKo:'BK21 4단계 — Ajou DREAM 인공지능 혁신인재 양성사업단',

   period:'2020.09 – 2024.08', role:'co'},

  {titleKo:'한국인 갑상선암 환자 프로파일링 및 일반화 혼합모형에 기반한 예후 예측 모델 개발',
   titleEn:'Profiling of Korean thyroid cancer patients and development of a prognostic prediction model based on generalized mixture models',

  {titleKo:'의료데이터를 위한 통계적 모델링과 기계학습 모델링의 효율적인 통합적 방법론 연구',

   agencyKo:'아주대학교', agencyEn:'Ajou University',
   period:'2018.10 – 2020.09', role:'pi'},

  {titleKo:'보건의료 데이터 예측 모형을 위한 통계적 방법론 연구',
   titleEn:'Statistical methodology for prediction models in healthcare data',
   agencyKo:'아주대학교', agencyEn:'Ajou University',
   period:'2019.10 – 2022.09', role:'co'},

  {titleKo:'센서퓨전을 통한 3D 물체 인식 알고리즘 개발 및 실무교육개발',

   agencyKo:'아주대학교', agencyEn:'Ajou University',
   period:'2015.09 – 2017.09', role:'pi'},
];

  pi:   {en:'PI',          ko:'책임', cls:'role-pi'},
  co:   {en:'Co-PI',       ko:'공동', cls:'role-co'},
  part: {en:'Participant', ko:'참여', cls:'role-part'},
};

document.getElementById('projlist').innerHTML = projects.map(p=>{
  const r = roleLabel[p.role] || roleLabel.part;
  return `<div class="proj">
    <div>
      <div class="p-title" data-en="${p.titleEn.replace(/"/g,'&quot;')}" data-ko="${p.titleKo.replace(/"/g,'&quot;')}">${p.titleKo}</div>

    </div>
    <div class="p-role ${r.cls}" data-en="${r.en}" data-ko="${r.ko}">${r.ko}</div>
  </div>`;
}).join('');

if(window.setLang){ try{ window.setLang(localStorage.getItem('starlab-lang')||'en'); }catch(e){} }
